name: CI
on: [push, pull_request]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run ty check --python-version 3.12
            - run: docker compose config --quiet
            - run: docker compose -f compose.triton.yaml config --quiet
            - run: docker compose up --build --wait --wait-timeout 120
            - run: docker compose exec -T gateway /app/.venv/bin/python --version
            - run: uv run python scripts/smoke_compose.py
            - name: Compose logs
              if: failure()
              run: docker compose logs --no-color
            - name: Stop Compose services
              if: always()
              run: docker compose down

    scenarios:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            COMPOSE_FILE: compose.yaml:compose.scenarios.yaml
            COMPOSE_PROJECT_NAME: bront-scenarios-ci
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen
            - run: docker compose config --quiet
            - name: Start scenario stack
              run: docker compose up --build --wait --wait-timeout 120
            - name: Run reusable proxy scenarios
              run: |
                  uv run --frozen bront run examples/scenarios/proxy-outage.toml --output reports/scenarios/proxy-outage.json
                  uv run --frozen bront run examples/scenarios/proxy-delay.toml --output reports/scenarios/proxy-delay.json
            - name: Render scenario HTML
              if: always() && hashFiles('reports/scenarios/*.json') != ''
              run: |
                  for source in reports/scenarios/*.json; do
                    uv run --frozen bront report "$source" --output "${source%.json}.html"
                  done
            - name: Upload scenario reports
              if: always() && hashFiles('reports/scenarios/*.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: scenario-reports
                  path: reports/scenarios/
                  if-no-files-found: error
                  retention-days: 14
            - name: Scenario Compose logs
              if: failure()
              run: docker compose logs --no-color
            - name: Stop scenario services
              if: always()
              run: docker compose down

    python-compatibility:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        strategy:
            fail-fast: false
            matrix:
                python: ["3.12", "3.13", "3.14"]
        env:
            UV_PYTHON: ${{ matrix.python }}
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen --python "${{ matrix.python }}"
            - run: uv run --frozen pytest
            - name: Build and install the standalone package
              run: |
                  uv build
                  uv venv --python "${{ matrix.python }}" "$RUNNER_TEMP/bront-core"
                  uv pip install --python "$RUNNER_TEMP/bront-core/bin/python" dist/bront-*.whl
                  "$RUNNER_TEMP/bront-core/bin/python" -c "import importlib.util; import bront.cli; assert importlib.util.find_spec('fastapi') is None"
            - name: Verify HTTP runs, comparisons, interruption handling, and HTML reports
              run: '"$RUNNER_TEMP/bront-core/bin/python" scripts/smoke_external.py'
            - name: Upload external endpoint reports
              if: always() && hashFiles('reports/external/*.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: external-endpoint-reports-py${{ matrix.python }}
                  path: reports/external/
                  if-no-files-found: error
                  retention-days: 14
