name: CI
on: [push, pull_request]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run ty check
            - run: uv run pytest
            - run: docker compose config --quiet
            - run: docker compose build
