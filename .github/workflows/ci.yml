name: CI
on: [push, pull_request]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run ty check
            - run: uv run pytest
            - run: docker compose config --quiet
            - run: docker compose up --build --wait --wait-timeout 120
            - run: docker compose exec -T gateway /app/.venv/bin/python --version
            - run: uv run python scripts/smoke_compose.py
            - name: Compose logs
              if: failure()
              run: docker compose logs --no-color
            - name: Stop Compose services
              if: always()
              run: docker compose down
