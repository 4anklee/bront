name: CI
on: [push, pull_request]

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen
            - run: uv run ruff check .
            - run: uv run ruff format --check .
            - run: uv run ty check
            - run: uv run pytest
            - run: docker compose config --quiet
            - run: docker compose -f compose.triton.yaml config --quiet
            - run: docker compose up --build --wait --wait-timeout 120
            - run: docker compose exec -T gateway /app/.venv/bin/python --version
            - run: uv run python scripts/smoke_compose.py
            - name: Compose logs
              if: failure()
              run: docker compose logs --no-color
            - name: Stop Compose services
              if: always()
              run: docker compose down

    benchmark:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        env:
            COMPOSE_FILE: compose.yaml:compose.benchmark.yaml
            COMPOSE_PROJECT_NAME: inferenceguard-benchmark-ci
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen
            - run: docker compose config --quiet
            - name: Start benchmark stack
              run: docker compose up --build --wait --wait-timeout 120
            - name: Run all benchmark scenarios
              run: >-
                  uv run --frozen inferenceguard benchmark
                  --scenario all --requests 20 --concurrency 4 --warmup 4
                  --gateway-url http://127.0.0.1:8000
                  --toxiproxy-url http://127.0.0.1:18474
                  --output reports/benchmark-ci.json
            - name: Run reusable proxy scenarios
              run: |
                  uv run --frozen bront run examples/scenarios/proxy-outage.toml --output reports/scenarios/proxy-outage.json
                  uv run --frozen bront run examples/scenarios/proxy-delay.toml --output reports/scenarios/proxy-delay.json
            - name: Upload scenario reports
              if: always() && hashFiles('reports/scenarios/*.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: scenario-reports
                  path: reports/scenarios/*.json
                  if-no-files-found: error
                  retention-days: 14
            - name: Upload benchmark report
              if: always() && hashFiles('reports/benchmark-ci.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: benchmark-report
                  path: reports/benchmark-ci.json
                  if-no-files-found: error
                  retention-days: 14
            - name: Benchmark Compose logs
              if: failure()
              run: docker compose logs --no-color
            - name: Stop benchmark services
              if: always()
              run: docker compose down

    external-endpoint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@v6
              with:
                  version: "0.11.21"
                  enable-cache: true
            - run: uv sync --frozen
            - name: Verify HTTP runs, repeated comparisons, and interruption handling
              run: uv run --frozen python scripts/smoke_external.py
            - name: Upload external endpoint reports
              if: always() && hashFiles('reports/external/*.json') != ''
              uses: actions/upload-artifact@v7
              with:
                  name: external-endpoint-reports
                  path: reports/external/
                  if-no-files-found: error
                  retention-days: 14
