# Overlay either compose.yaml or compose.triton.yaml for controlled fault scenarios.
services:
    gateway:
        environment:
            BRONT_PRIMARY_URL: http://fault-proxy:8666
        depends_on:
            fault-proxy:
                condition: service_healthy

    fault-proxy:
        image: ghcr.io/shopify/toxiproxy:2.12.0
        command: ["-host=0.0.0.0", "-config=/config/proxies.json"]
        ports: ["127.0.0.1:${BRONT_TOXIPROXY_PORT:-18474}:8474"]
        volumes:
            - ./deploy/toxiproxy/proxies.json:/config/proxies.json:ro
        healthcheck:
            test: ["CMD", "/toxiproxy-cli", "list"]
            interval: 5s
            timeout: 3s
            retries: 10
