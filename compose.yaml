x-service: &service
    build: .
    init: true
    healthcheck:
        test:
            [
                "CMD",
                "/app/.venv/bin/python",
                "-c",
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
            ]
        interval: 5s
        timeout: 3s
        retries: 5
        start_period: 10s

services:
    gateway:
        <<: *service
        ports: ["127.0.0.1:${IG_GATEWAY_PORT:-8000}:8000"]
        environment:
            IG_PRIMARY_URL: http://primary:8000
            IG_FALLBACK_URL: http://fallback:8000
            IG_REQUEST_TIMEOUT_SECONDS: "1"
            IG_FAILURE_THRESHOLD: "3"
            IG_RECOVERY_TIMEOUT_SECONDS: "10"
        depends_on:
            primary:
                condition: service_healthy
            fallback:
                condition: service_healthy

    primary:
        <<: *service
        command:
            [
                "/app/.venv/bin/uvicorn",
                "inference_guard.mock_backend:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8000",
            ]
        ports: ["127.0.0.1:${IG_PRIMARY_PORT:-8001}:8000"]

    fallback:
        <<: *service
        command:
            [
                "/app/.venv/bin/uvicorn",
                "inference_guard.mock_backend:app",
                "--host",
                "0.0.0.0",
                "--port",
                "8000",
            ]
        ports: ["127.0.0.1:${IG_FALLBACK_PORT:-8002}:8000"]

    prometheus:
        image: prom/prometheus:v3.2.1
        profiles: ["observability"]
        ports: ["127.0.0.1:9090:9090"]
        volumes:
            - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
