apiVersion: apps/v1
kind: Deployment
metadata:
    name: fallback
spec:
    replicas: 1
    selector:
        matchLabels:
            app: fallback
    template:
        metadata:
            labels:
                app: fallback
        spec:
            containers:
                - name: fallback
                  image: inference-guard:local
                  imagePullPolicy: IfNotPresent
                  command:
                      - /app/.venv/bin/uvicorn
                      - inference_guard.mock_backend:app
                      - --host
                      - 0.0.0.0
                      - --port
                      - "8000"
                  ports:
                      - name: http
                        containerPort: 8000
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: "1"
                          memory: 256Mi
                  startupProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 2
                      failureThreshold: 30
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 2
                  readinessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 2
                      timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
    name: fallback
spec:
    selector:
        app: fallback
    ports:
        - name: http
          port: 8000
          targetPort: http
