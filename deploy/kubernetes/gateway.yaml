apiVersion: apps/v1
kind: Deployment
metadata:
    name: gateway
spec:
    replicas: 2
    minReadySeconds: 5
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxUnavailable: 0
            maxSurge: 1
    selector:
        matchLabels:
            app: gateway
    template:
        metadata:
            labels:
                app: gateway
        spec:
            terminationGracePeriodSeconds: 30
            containers:
                - name: gateway
                  image: bront:local
                  imagePullPolicy: IfNotPresent
                  lifecycle:
                      preStop:
                          exec:
                              # Retire keep-alive connections while endpoint removal propagates.
                              command:
                                  - /app/.venv/bin/python
                                  - -c
                                  - |
                                    import os
                                    import time
                                    from pathlib import Path
                                    Path(os.environ["BRONT_DRAIN_FILE"]).touch()
                                    time.sleep(10)
                  ports:
                      - name: http
                        containerPort: 8000
                  envFrom:
                      - configMapRef:
                            name: gateway-config
                  resources:
                      requests:
                          cpu: 100m
                          memory: 128Mi
                      limits:
                          cpu: "1"
                          memory: 256Mi
                  startupProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 2
                      failureThreshold: 30
                  livenessProbe:
                      httpGet:
                          path: /healthz
                          port: http
                      periodSeconds: 10
                      timeoutSeconds: 2
                  readinessProbe:
                      httpGet:
                          path: /readyz
                          port: http
                      periodSeconds: 2
                      timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
    name: gateway
spec:
    selector:
        app: gateway
    ports:
        - name: http
          port: 8000
          targetPort: http
