apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bront
resources:
    - namespace.yaml
    - gateway.yaml
    - triton.yaml
    - fallback.yaml
    - ../triton
configMapGenerator:
    - name: gateway-config
      literals:
          - BRONT_PRIMARY_PROTOCOL=triton
          - BRONT_PRIMARY_URL=http://triton:8000
          - BRONT_FALLBACK_URL=http://fallback:8000
          - BRONT_REQUEST_TIMEOUT_SECONDS=1
          - BRONT_FAILURE_THRESHOLD=3
          - BRONT_RECOVERY_TIMEOUT_SECONDS=10
          - BRONT_DRAIN_FILE=/tmp/bront-draining
