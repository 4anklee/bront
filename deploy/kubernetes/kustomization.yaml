apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference-guard
resources:
    - namespace.yaml
    - gateway.yaml
    - triton.yaml
    - fallback.yaml
    - ../triton
configMapGenerator:
    - name: gateway-config
      literals:
          - IG_PRIMARY_PROTOCOL=triton
          - IG_PRIMARY_URL=http://triton:8000
          - IG_FALLBACK_URL=http://fallback:8000
          - IG_REQUEST_TIMEOUT_SECONDS=1
          - IG_FAILURE_THRESHOLD=3
          - IG_RECOVERY_TIMEOUT_SECONDS=10
