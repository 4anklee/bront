apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: inference-guard
resources:
  - prometheus.yaml
  - grafana.yaml
configMapGenerator:
  - name: prometheus-pod-config
    files: [prometheus.yml]
  - name: grafana-provisioning
    files: [datasources.yml, dashboards.yml]
  - name: grafana-dashboard
    files: [gateway.json]
