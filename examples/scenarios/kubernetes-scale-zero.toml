version = 1

[target]
url = "http://127.0.0.1:18080/api/v1/namespaces/inference-guard/services/gateway:8000/proxy/v1/infer"
[target.backend]
pointer = "/backend"

[workload]
cases = "../gateway/cases.jsonl"
duration_seconds = 90
concurrency = 4
warmup_requests = 4
request_timeout_seconds = 5

[scenario]
kind = "kubernetes-scale-zero"
context = "kind-inference-guard"
namespace = "inference-guard"
deployment = "triton"
expected_replicas = 1
at_seconds = 3
hold_seconds = 3
observe_timeout_seconds = 45

[assertions]
max_failed_requests = 0
recovery_within_seconds = 5
preferred_backend = "primary"
preferred_backend_within_seconds = 30
