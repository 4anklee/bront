[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "inference-guard"
version = "0.1.0"
description = "A reliability gateway for compatible inference backends"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "prometheus-client>=0.21,<1",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1,<2",
  "rich>=14,<16",
  "typer>=0.20,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
inferenceguard = "inference_guard.cli:app"

[dependency-groups]
dev = [
    "onnx>=1.20,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.9,<1",
    "ty>=0.0.86",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inference_guard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
